

name: Earnings Alert

on:
  schedule:
    - cron: "0 2 * * *" # 09:00 Thailand time (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-alert
  cancel-in-progress: false

jobs:
  check-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check earnings and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python check_earnings.py

      - name: Save notification history
        run: |
          if [[ -n "$(git status --porcelain data/sent.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sent.json
            git commit -m "Update earnings notification history"
            git push
          fi
