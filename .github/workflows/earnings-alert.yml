
name: Earnings Alert

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select TEST or NORMAL mode"
        required: true
        type: choice
        default: NORMAL
        options:
          - TEST
          - NORMAL

permissions:
  contents: write

concurrency:
  group: earnings-alert-main
  cancel-in-progress: false

jobs:
  check-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEST - Send notification to ntfy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'TEST'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC secret is missing"
            exit 1
          fi

          curl -fsS \
            -H "Click: https://stockanalysis.com/stocks/nvda/financials/" \
            -d "Earnings Alert TEST: ระบบแจ้งเตือนทำงานสำเร็จ 🎉\nแตะการแจ้งเตือนเพื่อทดลองเปิดหน้างบ NVDA\nhttps://stockanalysis.com/stocks/nvda/financials/" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: NORMAL - Check earnings
        if: github.event_name == 'schedule' || inputs.mode == 'NORMAL'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python check_earnings.py

      - name: Save earnings data and notification history
        if: github.event_name == 'schedule' || inputs.mode == 'NORMAL'
        run: |
          if [[ -n "$(git status --porcelain data/earnings.json data/sent.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/earnings.json
            if [ -f data/sent.json ]; then git add data/sent.json; fi
            git commit -m "Update earnings data and notification history"
            # Rebase data changes onto main in case the Watchlist was saved during this run.
            git pull --rebase origin main
            git push
          else
            echo "No data changes to save"
          fi
